*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}

/* conteúdo */
.main{min-width:0}
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.tg{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--line);background:var(--sf);border-radius:.7rem;padding:.32rem .7rem;font-size:.8rem;font-weight:600;color:var(--mut)}

.tg i:after{content:"";position:absolute;left:2px;top:2px;width:.85rem;height:.85rem;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}

.ib{border:1px solid var(--line);background:var(--sf);border-radius:.7rem;padding:.32rem .75rem;font-size:.8rem;font-weight:600;color:var(--mut);display:inline-flex;gap:.4rem;align-items:center}

.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,27rem),1fr));align-items:start;margin-bottom:1rem}

.tip b{display:block;margin-bottom:.15rem}.tip div{display:flex;gap:.4rem;align-items:center}.tip i{width:.6rem;height:.6rem;border-radius:2px;flex:none}.tip em{margin-left:auto;font-style:normal;font-weight:700;padding-left:.8rem;font-variant-numeric:tabular-nums}

footer{color:var(--faint);font-size:.74rem;margin-top:2rem;max-width:56rem}
